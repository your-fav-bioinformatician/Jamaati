<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جامعتي</title>

    <!-- Resolve theme and language before first paint, so there's no flash
         of the wrong colours or text direction. Must stay in sync with
         STORAGE_KEY in ThemeProvider.jsx and LangProvider.jsx. -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = null, lang = null;
        try {
          theme = localStorage.getItem('jamaati-theme');
          lang = localStorage.getItem('jamaati-lang');
        } catch (e) {}
        var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = dark ? 'dark' : 'light';
        if (lang === 'en' || lang === 'ar') {
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Lalezar (display) + IBM Plex Sans Arabic (body), same as the Flutter app. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&display=swap"
    />
    <!-- Rounded Material icons (Icons.*_rounded), filled or outlined via the FILL axis. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
